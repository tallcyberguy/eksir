<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1280 720" role="img">
<title>EKSIR system architecture</title>
<desc>EKSIR (repo codename isoc) is a vendor-agnostic, deterministic-first SOC workbench for SMEs and MSSPs. Connectors and webhooks feed a deterministic pipeline that normalizes to OCSF, recalls prior verdicts from vector memory, enriches with threat intelligence and closes what it can with no LLM. When the decision gate is inconclusive, a LangGraph persona graph runs L1 triage, L2 analysis, an optional threat hunt and an optional forensic reconstruction, and a manager persona builds a proposed verdict plus proposed response actions. A human analyst sign-off gate is the only commit point: approval writes the verdict, indexes it back to vector memory and fires the approved EDR actions.</desc>
