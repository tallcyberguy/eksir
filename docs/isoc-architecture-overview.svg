  .rsub{font-weight:400;font-size:11px;fill:#6B7280}
  .ct{font-weight:500;font-size:14px}
  .cs{font-weight:400;font-size:11px}
  .cs12{font-weight:400;font-size:12px}
  .cht{font-weight:500;font-size:13px}
  .chs{font-weight:400;font-size:11px}
  .gt{font-weight:500;font-size:16px}
  .leg{font-weight:400;font-size:12px}
  .foot{font-weight:400;font-size:12px;fill:#94A3B8}
</style>
