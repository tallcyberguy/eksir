<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1280 720" role="img">
<title>XAI-SOC system architecture</title>
<desc>XAI-SOC is a vendor-agnostic, deterministic-first SOC platform for SMEs and MSSPs. Data sources feed a deterministic triage and enrichment gate. When inconclusive, an orchestrator (Incident Manager) runs an agentic loop: it queries a knowledge base and read-only tools and dispatches to specialist agents (L1, L2, threat hunt, forensics), re-evaluating until confident, then proposes a verdict. A human analyst sign-off gate is the only commit point, feeding results back to the knowledge base.</desc>
