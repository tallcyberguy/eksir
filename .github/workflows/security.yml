# Security scanning — Trivy + npm audit + pip-audit, SARIF upload.
#
# Sits next to ci.yml; runs independently. Three lenses on the same problem:
#   • Trivy        — OSS / OS-layer / IaC / secrets, all artifacts
#   • npm audit    — npm's native advisory DB for /frontend deps
#   • pip-audit    — PyPI Safety DB for /backend deps
#
# Mode: WARN-ONLY (does not fail CI). The Security tab is the queryable record;
# CI failure is too heavy a hammer until we know what the noise floor looks
# like. Flip to blocking later by setting `exit-code: '1'` on Trivy and dropping
# the `|| true`/`continue-on-error: true` on the others. See
# DEVSECOPS_PLAN.md → "Vulnerability scanning" for the policy.

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 Istanbul = 03:00 UTC. Catches CVEs published against
    # unchanged code over the weekend — the silent-vulnerability window.
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required for SARIF upload to the Security tab
  actions: read            # required by upload-sarif to fetch run metadata

jobs:
  # ── Trivy filesystem scan (catches manifests + lockfiles + IaC + secrets) ─
  trivy:
    name: Trivy fs scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy fs scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Warn-only: report everything, fail nothing.
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          # Skip the things we don't need scanned:
          skip-dirs: 'vendor,node_modules,.next,deploy/data'
          # Pick up .trivyignore at the repo root if present.
          ignore-unfixed: false

      - name: Upload SARIF to Security tab
        # GitHub Code Scanning (the Security tab integration) requires GitHub
        # Advanced Security on private repos ($49/seat/mo). On free tier this
        # step 403s with "Code scanning is not enabled". Don't fail CI for it —
        # we keep the SARIF as a downloadable artifact below. If you later
        # enable GHAS or make the repo public, this step starts working.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Upload SARIF as workflow artifact (fallback for free-tier)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-${{ github.run_id }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Human-readable Trivy report (in run logs)
        # Same scan, table format, for humans reading the CI log instead of
        # the Security tab. Severity-filtered to keep the log readable.
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'vendor,node_modules,.next,deploy/data'

  # ── npm audit (Node-specific advisory DB) ────────────────────────────────
  npm-audit:
    name: npm audit (frontend + landing)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each frontend/landing has its own package.json; scan each.
        dir: [frontend, landing]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install deps to generate lockfile + audit (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        # `npm audit` needs a lockfile. We don't commit one (yet), so generate
        # it on the fly. Warn-only: the `|| true` swallows the exit code while
        # the audit output still appears in CI logs.
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          echo "::group::npm audit (${{ matrix.dir }})"
          npm audit --audit-level=high || true
          echo "::endgroup::"

  # ── pip-audit (PyPI Safety DB) ────────────────────────────────────────────
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install pip-audit + project deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[dev]"

      - name: Run pip-audit
        working-directory: backend
        # Warn-only.
        run: |
          echo "::group::pip-audit"
          pip-audit --strict || true
          echo "::endgroup::"
