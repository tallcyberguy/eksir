# EKSIR CI — lint + type-check + frontend build on every PR + push to main.
#
# "Don't ship broken code": lint + type-check + the backend unit-test suite +
# a frontend build on every PR and push to main. Image builds live in
# release.yml; this workflow only guarantees the code parses, type-checks, and
# the pure unit tests pass. The backend tests need no Postgres/Redis/Qdrant/LLM.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manual runs from the Actions UI for re-checks.
  workflow_dispatch:

# Cancel duplicate runs (e.g. when force-pushing to the same PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # No requirements.txt — deps are in pyproject.toml. Caching pip by
          # the lockfile-ish hash of pyproject keeps re-runs fast.
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint + import order)
        run: ruff check isoc_api

      - name: MyPy (type-check)
        # `|| true` for now — mypy on a codebase that wasn't built with strict
        # types from day one will surface many warnings. Tighten later by
        # dropping the `|| true` once the warning count is manageable.
        run: mypy isoc_api || true

      - name: Pytest (pure unit tests)
        # Tolerates exit code 5 ("no tests collected") so a future empty suite
        # doesn't fail the job. The suite imports isoc_api.* directly and needs
        # no running stack.
        run: pytest -q || [ $? -eq 5 ]

  frontend:
    name: Frontend (lint + type + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          # If a lockfile shows up later (npm ci), this caches it.
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        # No package-lock.json in the repo today; `npm install` fits. The
        # --legacy-peer-deps mirrors the Dockerfile so CI and prod match.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type

      - name: Build
        # Catches the kind of TS compilation errors that broke our dev cycle
        # earlier — `docker compose build` silently kept the old image when
        # `next build` failed. Running it in CI surfaces those immediately.
        run: npm run build
        env:
          # Production-style build but without leaking real backend URLs.
          NEXT_PUBLIC_API_BASE: /api
          NEXT_TELEMETRY_DISABLED: 1

  # Aggregator job so branch protection (when added) only needs to require one
  # check. Lets us tweak the matrix without touching the protection rule.
  ci-ok:
    name: CI green
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Mark success only if both upstream jobs passed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::One or more jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
