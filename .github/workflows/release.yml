# Build + push container images to GHCR.
#
# Phase 2b of the DevSecOps plan: shippable artifacts. Every push to main and
# every tag produces pull-able images at ghcr.io/tallcyberguy/eksir-*.
#
# Triggers:
#   push to main   → tag the image as :latest and :sha-<short-sha>
#   push tag v*    → also tag the image as :v<version>
#   workflow_dispatch → manual rebuild without a code change
#
# Worker doesn't have its own image — it runs the backend image with a
# different CMD. See deploy/docker-compose.prod.yml.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # don't cancel a release tag build halfway

permissions:
  contents: read
  packages: write             # required to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/eksir

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata + tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.image }}
          tags: |
            # Always: short SHA tag, immutable
            type=sha,prefix=sha-,format=short
            # On main: floating :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # On vX.Y.Z tag: pin to that version
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # On vX.Y.Z tag: also a major.minor moving tag, for "latest 0.1.x"
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=EKSIR ${{ matrix.image }}
            org.opencontainers.image.description=EKSIR Security Operations Platform — ${{ matrix.image }}

      - name: Build + push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Production VPS is amd64 by default. If we ever deploy to an ARM
          # host (e.g. AWS Graviton), add linux/arm64 here — but it doubles
          # build time so leave it out until needed.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Aggressive layer caching via GHA's built-in cache backend.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Print pull instructions
        run: |
          echo "::notice::Image ready: docker pull ${{ env.IMAGE_BASE }}-${{ matrix.image }}:latest"
          echo "All tags pushed:"
          echo "${{ steps.meta.outputs.tags }}"
